name = "diamond-mcp"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

# Stienhardt's hosted Model Context Protocol endpoint (Streamable HTTP, stateless).
# Serves the diamond-mcp education tools plus live-inventory tools that proxy the
# store's Universal Commerce Protocol server with this Worker's own agent profile.

[vars]
UCP_ENDPOINT = "https://stienhard-stones.myshopify.com/api/ucp/mcp"
STORE_ORIGIN = "https://stienhardt.com"
# Shopify's UCP profile fetcher refuses *.workers.dev hosts ("Http error"); a CDN-hosted copy of the
# same profile passes. Pin to a pushed commit sha (jsDelivr caches @main for days).
AGENT_PROFILE_URL = "https://cdn.jsdelivr.net/gh/JacobiusMakes/diamond-mcp@13c204f2316b2d48b764db3e/agent-profile.json"
# OpenAI plugin directory domain verification: paste the portal token here (or `wrangler secret put
# OPENAI_APPS_CHALLENGE`) before submitting; served at /.well-known/openai-apps-challenge.
# OPENAI_APPS_CHALLENGE = ""

[[kv_namespaces]]
binding = "CLICK_COUNTS"
id = "3574e08debb745afa57f764c71d5684a"

name: Publish MCP Registry metadata

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Verify MCPB artifact hash
        run: |
          bundle_url="$(jq -r '.packages[0].identifier' server.json)"
          expected_sha="$(jq -r '.packages[0].fileSha256' server.json)"
          curl --fail --location "$bundle_url" --output /tmp/diamond-mcp.mcpb
          actual_sha="$(sha256sum /tmp/diamond-mcp.mcpb | cut -d ' ' -f 1)"
          test "$actual_sha" = "$expected_sha"

      - name: Install MCP publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher

      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish registry metadata
        run: ./mcp-publisher publish server.json

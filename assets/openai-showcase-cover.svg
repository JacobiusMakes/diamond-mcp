<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Stienhardt Diamond MCP</title>
  <desc id="desc">Sourced diamond answers, live inventory, and measurable product links for AI assistants.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1c2c"/>
      <stop offset="1" stop-color="#1c3348"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#bfd6e7"/>
      <stop offset="1" stop-color="#6e8fa8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#000000" flood-opacity="0.32"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1360" cy="90" r="360" fill="#35546c" opacity="0.18"/>
  <circle cx="1500" cy="850" r="410" fill="#06111c" opacity="0.3"/>

  <g transform="translate(1030 180)" filter="url(#shadow)">
    <path d="M260 0 510 170 420 480 100 480 10 170Z" fill="none" stroke="url(#gem)" stroke-width="10"/>
    <path d="M10 170h500M260 0 100 480M260 0l160 480M10 170l410 310M510 170 100 480M10 170l250 145 250-145M260 315 100 480M260 315l160 165" fill="none" stroke="#dbe9f3" stroke-width="5" opacity="0.85"/>
    <circle cx="260" cy="315" r="16" fill="#ffffff"/>
  </g>

  <text x="120" y="150" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="54" letter-spacing="14">STIENHARDT</text>
  <text x="120" y="340" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="104" font-weight="700">Diamond MCP</text>
  <text x="120" y="420" fill="#c9d9e5" font-family="Arial, Helvetica, sans-serif" font-size="38">Ten read-only tools for diamond questions and product discovery.</text>

  <g transform="translate(120 535)" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="#ffffff">
    <rect width="280" height="72" rx="36" fill="#ffffff" opacity="0.12"/>
    <text x="140" y="47" text-anchor="middle">Sourced answers</text>
    <rect x="310" width="260" height="72" rx="36" fill="#ffffff" opacity="0.12"/>
    <text x="440" y="47" text-anchor="middle">Live inventory</text>
    <rect x="600" width="310" height="72" rx="36" fill="#ffffff" opacity="0.12"/>
    <text x="755" y="47" text-anchor="middle">Measurable links</text>
  </g>

  <text x="120" y="775" fill="#8eb0c7" font-family="Arial, Helvetica, sans-serif" font-size="27">Open source  •  No authentication  •  Built with Codex</text>
</svg>
